version: '3'


services:

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: eren
      POSTGRES_PASSWORD: eren
      POSTGRES_DB: node
    networks:
      - my-networks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - my-networks
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: nodejs-app
    ports:
      - "3000:3000"
    networks:
      - my-networks
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://eren:eren@postgres:5432/node
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_data:
    driver: local

networks:
  my-networks:
    driver: bridge
